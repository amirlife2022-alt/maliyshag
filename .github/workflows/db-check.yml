name: DB check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      W: npx --yes wrangler@4.162.0
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Query
        run: |
          ID=$($W d1 list --json | jq -r '.[] | select(.name=="maliyshag-db") | .uuid')
          printf 'name="x"\n[[d1_databases]]\nbinding="DB"\ndatabase_name="maliyshag-db"\ndatabase_id="%s"\n' "$ID" > wrangler.toml
          q() { $W d1 execute maliyshag-db --remote --json --command "$1" | jq -c '.[0].results'; }
          echo "purchases:"; q "SELECT kind, plan, product_id, amount, currency, datetime(created_at/1000,'unixepoch') t, substr(raw,1,600) raw FROM purchases ORDER BY created_at DESC LIMIT 5"
          echo "pro paid:"; q "SELECT plan, datetime(pro_until/1000,'unixepoch') until FROM pro WHERE pro_until > strftime('%s','now')*1000"
