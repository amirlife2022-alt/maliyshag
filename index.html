<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0B08">
<title>Qawiyy — трекер привычек</title>
<meta name="description" content="Qawiyy: трекер привычек. Малый шаг каждый день, отметки одним касанием, серии и прогресс.">
<link rel="icon" href="logo.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;
  --a:#D4F36B; --bg:#0A0B08; --ink:#0A0B08; --text:#F3F5EE; --text2:#D8DBCF; --soft:#C9CCBF; --mut:#A3A797; --dim:#8A8E80;
  --glass:rgba(255,255,255,.045); --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.14); --deep:#14160F; --sheet:#12140E;
  --fire:#F2A65A;
  --safeB:max(env(safe-area-inset-bottom),var(--tg-safe-area-inset-bottom,0px));
  --safeT:var(--tg-content-safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.35}
body{min-height:100dvh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select{font:inherit;color:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
svg.i .f{fill:var(--a);opacity:.38;stroke:none}
.card.on .ib svg.i .f,.icons button.on svg.i .f,.tab.on svg.i .f{fill:var(--ink);opacity:.22}
.ctabs{display:flex;gap:6px;overflow-x:auto;margin:0 -20px 10px;padding:0 20px 2px;scrollbar-width:none}
.ctabs::-webkit-scrollbar{display:none}
.ctabs button{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--text2)}
.ctabs button.on{background:var(--text);color:var(--ink);border-color:var(--text)}
.pro{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:999px;background:var(--a);color:var(--ink);font-size:9.5px;font-weight:800;letter-spacing:.06em}
.pro svg{width:10px;height:10px;stroke-width:2.4}
.icons button{position:relative}
.icons button.lock{opacity:.45}
.cnote{font-size:12px;color:var(--mut);margin-top:10px;display:flex;align-items:center;gap:6px}
.disp{font-family:Unbounded,Manrope,sans-serif;letter-spacing:-.02em}
.mut{color:var(--mut)}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:22px}
.glow{position:fixed;width:420px;height:420px;border-radius:50%;pointer-events:none;z-index:0;background:radial-gradient(circle,color-mix(in srgb,var(--a) 17%,transparent) 0%,transparent 65%);transition:all .5s}
.app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:calc(14px + var(--safeT)) 20px calc(120px + var(--safeB))}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 4px}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:42px;height:42px;border-radius:14px;background:#16180F;border:1px solid var(--line);display:grid;place-items:center}
.logo img{width:32px;height:32px}
.brand b{display:block;font-size:17px;font-weight:600}
.brand small{display:block;font-size:12px;margin-top:2px;color:var(--mut)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);font-size:12.5px;font-weight:600;white-space:nowrap;color:var(--text2)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--a)}
.pill.local .dot{background:var(--fire)}
.pill svg{width:15px;height:15px}

/* headings */
.sec{margin-top:26px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.sh h2{margin:0;font-size:18px;font-weight:800}
.sh span{font-size:13px;font-weight:600;color:var(--mut);text-align:right}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 4px}
.card-h h2{margin:0;font-size:16px;font-weight:800}
.card-h span{font-size:12px;font-weight:600;color:var(--mut)}
.box{border-radius:26px;padding:18px 16px;margin-top:12px}

/* today */
.dateline{font-size:13px;font-weight:600;color:var(--mut);margin-top:18px}
.hello{margin:6px 0 0;font-size:26px;font-weight:600;line-height:1.15}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:18px;touch-action:pan-y}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 6px;border-radius:18px;background:var(--glass);border:1px solid var(--line);color:var(--text)}
.wd span{font-size:11px;font-weight:700}
.wd b{font-size:16px;font-weight:800}
.wd i{width:5px;height:5px;border-radius:50%;background:transparent}
.wd i.on{background:var(--a)}
.wd.fut{color:var(--dim);cursor:default}
.wd.sel{background:var(--a);border-color:var(--a);color:var(--ink)}
.wd.sel i.on{background:var(--ink)}
.hero{position:relative;overflow:hidden;border-radius:30px;background:var(--deep);border:1px solid rgba(255,255,255,.08);padding:22px;margin-top:18px}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 92% 115%,color-mix(in srgb,var(--a) 70%,transparent) 0%,color-mix(in srgb,var(--a) 18%,transparent) 38%,transparent 62%);pointer-events:none}
.hero>*{position:relative}
.hrow{display:flex;align-items:center;gap:20px}
.ring{position:relative;width:124px;height:124px;flex-shrink:0}
.ring svg{width:124px;height:124px;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .v b{font-size:28px;font-weight:700}
.ring .v small{font-size:12px;font-weight:600;margin-top:2px;color:var(--mut)}
.hero h3{margin:0;font-size:19px;font-weight:600;line-height:1.2}
.hero p{font-size:13.5px;line-height:1.4;margin:6px 0 0;color:var(--soft)}
.hpills{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.hpills .pill{background:rgba(10,11,8,.6);color:var(--text)}
.list{display:grid;gap:10px}
@media(min-width:700px){.list.two{grid-template-columns:1fr 1fr}}
.card{display:flex;align-items:center;gap:14px;width:100%;padding:12px;background:var(--glass);border:1px solid var(--line);border-radius:22px;transition:background .2s,border-color .2s,transform .08s}
button.card:active{transform:scale(.985)}
.card.on{background:color-mix(in srgb,var(--a) 9%,#11130D);border-color:color-mix(in srgb,var(--a) 35%,transparent)}
.ib{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.06);display:grid;place-items:center;color:#E6E9DD;flex-shrink:0;transition:background .2s,color .2s}
.card.on .ib{background:var(--a);color:var(--ink)}
.tx{flex:1;min-width:0}
.tx b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx small{display:flex;align-items:center;gap:5px;font-size:12.5px;margin-top:4px;color:var(--mut)}
.tx small svg{width:13px;height:13px;stroke-width:2;color:var(--fire)}
.chk{width:40px;height:40px;border-radius:50%;border:1.6px solid rgba(255,255,255,.28);display:grid;place-items:center;color:var(--ink);flex-shrink:0;transition:background .2s,border-color .2s}
.chk svg{width:20px;height:20px;stroke-width:2.6;opacity:0;transform:scale(.6);transition:all .2s}
.card.on .chk{background:var(--a);border-color:var(--a)}
.card.on .chk svg{opacity:1;transform:none}
.promo{display:flex;align-items:center;gap:14px;padding:14px;border-radius:22px;background:var(--glass);border:1px solid var(--line);margin-top:26px}
.promo .ib{color:var(--a)}
.btn-s{height:40px;padding:0 16px;border-radius:999px;background:var(--a);color:var(--ink);font-weight:800;font-size:13px;flex-shrink:0}
.empty{text-align:center;padding:28px 18px;margin-top:26px}
.empty p{color:var(--mut);margin:6px 0 16px}

/* month / year */
.nav3{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
.nav3 h1{margin:0;font-size:22px;font-weight:600;text-align:center}
.nav3 div{text-align:center}
.nav3 small{display:block;font-size:12.5px;font-weight:600;margin-top:3px;color:var(--mut)}
.circ{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--text)}
.circ svg{width:20px;height:20px;stroke-width:2}
.circ:disabled{opacity:.3;cursor:default}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:20px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{border-radius:24px;padding:16px;background:var(--glass);border:1px solid var(--line)}
.kpi small{display:block;font-size:11.5px;font-weight:800;letter-spacing:.08em;color:var(--mut)}
.kpi b{display:block;font-size:34px;font-weight:700;margin-top:10px;line-height:1.1}
.kpi em{display:block;font-style:normal;font-size:12.5px;font-weight:600;margin-top:4px;color:var(--mut)}
.kpi.acc{background:var(--a);border-color:var(--a);color:var(--ink)}
.kpi.acc small{color:var(--ink)} .kpi.acc em{color:#2A2E1E}
.chart{width:100%;display:block;margin-top:12px}
.chart text{fill:var(--dim);font-size:10px;font-weight:600;font-family:Manrope,sans-serif}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin-top:14px}
.cal .h{text-align:center;font-size:11px;font-weight:700;color:var(--mut)}
.cal button,.cal .e{position:relative;height:38px;border-radius:12px;display:grid;place-items:center;font-size:12.5px;font-weight:700}
.cal .pdot{position:absolute;left:50%;bottom:4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#F3F5EE;box-shadow:0 0 0 1px rgba(10,11,8,.5)}
.tab span{white-space:nowrap}
@media(max-width:380px){.tab{font-size:10px}.tab svg{width:19px;height:19px}}
.sugg button.on{background:var(--a);color:var(--ink);border-color:var(--a)}
.cal button.fut{cursor:default}
.goals{display:flex;flex-direction:column;gap:14px;margin-top:16px;padding:0 4px}
.goal .l{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;font-weight:700}
.goal .l span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goal .l span:last-child{color:var(--mut);font-weight:600;white-space:nowrap}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.08);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--a);min-width:3%}
.wks{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.wk{min-width:48px;height:34px;padding:0 9px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:12px;font-weight:700;color:var(--mut)}
.wk.on{background:var(--a);border-color:var(--a);color:var(--ink)}
.wk:disabled{opacity:.35;cursor:default}
.yhero:before{background:radial-gradient(circle at 100% 0%,color-mix(in srgb,var(--a) 60%,transparent) 0%,color-mix(in srgb,var(--a) 14%,transparent) 40%,transparent 65%)}
.big{display:flex;align-items:flex-end;gap:10px;margin-top:6px}
.big b{font-size:64px;font-weight:700;line-height:1}
.big span{font-size:13.5px;font-weight:600;color:var(--soft);padding-bottom:9px}
.mini3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:20px}
.mini3 div{border-radius:18px;padding:12px;background:rgba(10,11,8,.55)}
.mini3 b{display:block;font-size:20px;font-weight:700}
.mini3 small{display:block;font-size:11.5px;font-weight:600;margin-top:3px;color:var(--mut)}
.bars{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;margin-top:16px;align-items:end}
.bars .pv{height:16px;font-size:10px;font-weight:800;color:var(--a);text-align:center}
.bars .col{position:relative;height:120px;border-radius:9px;background:rgba(255,255,255,.05);overflow:hidden}
.bars .col i{position:absolute;left:0;right:0;bottom:0;border-radius:9px;background:var(--a);min-height:12px}
.bars .ml{text-align:center;font-size:11px;font-weight:700;margin-top:7px;color:var(--dim)}
.bars .ml.cur{color:var(--text)}
.ymap{display:grid;grid-template-rows:repeat(7,auto);grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;margin-top:16px}
.ymap i{display:block;aspect-ratio:1;border-radius:1.5px;background:rgba(255,255,255,.09)}
.ymap i.f{background:rgba(255,255,255,.035)} .ymap i.x{background:transparent}
.ymap i.t{box-shadow:0 0 0 1px var(--a)}
.mlabels{display:grid;grid-auto-columns:minmax(0,1fr);gap:2px;padding-top:10px;font-size:10.5px;font-weight:700;color:var(--mut);white-space:nowrap}
.legend{display:flex;align-items:center;justify-content:flex-end;gap:5px;margin-top:12px;font-size:11.5px;font-weight:600;color:var(--mut)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* habits */
.h1{margin:18px 0 0;font-size:26px;font-weight:600}
.addbtn{margin-top:16px;width:100%;height:60px;border-radius:999px;background:var(--a);color:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 7px 0 24px}
.addbtn span:first-child{font-size:14px;font-weight:800;letter-spacing:.06em}
.addbtn span:last-child{width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--a);display:grid;place-items:center}
.filters{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.filters .pill.on{background:var(--text);color:var(--ink);border-color:var(--text)}
.ritem{position:relative;transition:transform .15s}
.ritem.drag{z-index:5;transition:none}
.ritem.drag .card{background:#1B1E15;border-color:color-mix(in srgb,var(--a) 45%,transparent);box-shadow:0 18px 30px rgba(0,0,0,.45)}
.ritem .card{padding-right:6px}
.handle{width:40px;height:44px;display:grid;place-items:center;color:var(--dim);touch-action:none;cursor:grab;flex-shrink:0}
.handle svg{stroke-width:3}
.swatches{display:flex;gap:10px;margin-top:12px}
.sw{width:44px;height:44px;border-radius:50%;border:2px solid transparent;display:grid;place-items:center}
.sw i{width:30px;height:30px;border-radius:50%;display:block}
.sw.on{border-color:var(--text)}
.note{color:var(--mut);font-size:12.5px;text-align:center;margin-top:18px;line-height:1.45}

.swr{position:relative;border-radius:22px;touch-action:pan-y}
.swr>.card{position:relative;z-index:1;transition:transform .28s cubic-bezier(.2,.8,.2,1),background .2s,border-color .2s;will-change:transform}
.swr>.card:not(.on){background:#141512}
.swd{position:absolute;right:10px;top:50%;width:58px;height:58px;margin-top:-29px;border-radius:50%;background:#E5534B;color:#fff;display:grid;place-items:center;opacity:0;transform:scale(.6);transition:opacity .2s,transform .2s;z-index:0}
.swr.dragging .swd{transition:none}
.swd svg{width:24px;height:24px;stroke-width:2}
.toast .undo{margin-left:12px;padding:5px 12px;border-radius:999px;background:var(--ink);color:var(--a);font-weight:800;font-size:13px;pointer-events:auto}
.toast{display:flex;align-items:center}
.remrows{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.remrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 6px 6px 16px;border-radius:16px;background:var(--glass);border:1px solid var(--line)}
.remrow span{font-weight:700;font-size:14px;display:flex;flex-direction:column}
.remrow span small{font-weight:600;font-size:12px;color:var(--a);margin-top:2px}
.remrow.gone span small{color:var(--mut)}
.remrow .inp{width:136px;height:44px;flex-shrink:0;padding:0 12px}
.procard{display:flex;align-items:center;gap:14px;padding:14px;margin-top:16px;border-radius:22px;background:linear-gradient(120deg,color-mix(in srgb,var(--a) 16%,#14160F),#14160F 70%);border:1px solid color-mix(in srgb,var(--a) 35%,transparent)}
.procard .ib{background:var(--a);color:var(--ink)}
.procard .tx small{color:var(--soft)}
.procard .tx b{white-space:normal}
.procard.free{background:#14160F;border-color:var(--line)}
.card.locked{opacity:.62}
.card.locked .ib{color:var(--mut)}
.feats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}
.feats>div{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:var(--glass);border:1px solid var(--line)}
.feats .ib{width:36px;height:36px;border-radius:11px;color:var(--a)}
.feats .ib svg{width:18px;height:18px}
.feats .tx b{font-size:13px;white-space:normal}
.feats .tx small{display:block;font-size:11.5px;margin-top:2px;white-space:normal}
@media(max-width:380px){.feats{grid-template-columns:1fr}}
.plans{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.plancard{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:20px;background:var(--glass);border:1.5px solid var(--line);text-align:left}
.plancard.on{border-color:var(--a);background:color-mix(in srgb,var(--a) 10%,transparent)}
.plancard .rad{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);flex-shrink:0}
.plancard.on .rad{border:6px solid var(--a)}
.plancard .pr{display:flex;flex-direction:column;align-items:flex-end;font-weight:800;font-size:17px}
.plancard .pr i{font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:.04em;padding:3px 7px;border-radius:999px;background:var(--a);color:var(--ink);margin-top:4px;text-transform:uppercase}
/* nav */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--safeB));z-index:20;display:flex;gap:4px;padding:6px;border-radius:28px;background:rgba(24,26,19,.82);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 20px 40px rgba(0,0,0,.5);width:min(520px,calc(100% - 24px))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:56px;border-radius:20px;color:var(--mut);font-size:11px;font-weight:700;transition:background .2s,color .2s}
.tab svg{width:21px;height:21px}
.tab.on{background:var(--a);color:var(--ink)}

/* start screen */
.start{position:fixed;inset:0;z-index:50;overflow:hidden;background:var(--bg);display:none;transition:opacity .45s ease,transform .45s ease}
.start.on{display:block}
.start.out{opacity:0;transform:scale(1.04);pointer-events:none}
.start .bgr{position:absolute;inset:0;background:linear-gradient(180deg,var(--bg) 0%,var(--bg) 38%,color-mix(in srgb,var(--a) 55%,var(--bg)) 66%,var(--a) 88%,color-mix(in srgb,var(--a) 70%,#fff) 100%);opacity:0;animation:fadeIn 1.2s ease .1s forwards}
.start .orb{position:absolute;left:50%;top:18%;width:320px;height:320px;margin-left:-160px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--a) 26%,transparent) 0%,transparent 70%);opacity:0;animation:fadeIn 1s ease .3s forwards,breathe 5s ease-in-out 2.2s infinite}
.start .in{position:relative;display:flex;flex-direction:column;align-items:center;height:100%;max-width:440px;margin:0 auto;padding:calc(28px + var(--safeT)) 24px calc(34px + var(--safeB))}
.lgw{width:min(260px,58vw);animation:float 5.5s ease-in-out 2.4s infinite}
.lg{display:block;width:100%;height:auto;overflow:visible}
.lg .mk{stroke-dasharray:1 1;stroke-dashoffset:1}
.lg .m1{animation:draw 1s cubic-bezier(.55,0,.3,1) .35s forwards}
.lg .m2{animation:draw .22s linear 1.3s forwards}
.lg .m3{animation:draw .32s cubic-bezier(.2,.8,.3,1) 1.5s forwards}
.lg .st{transform-box:fill-box;transform-origin:center;opacity:0;animation:pop .6s cubic-bezier(.2,1.5,.4,1) 1.75s forwards,twinkle 2.8s ease-in-out 2.6s infinite}

const haptic = (kind) => { try {
  if (!tg || !tg.HapticFeedback) return;
  if (kind === 'success') tg.HapticFeedback.notificationOccurred('success');
  else if (kind === 'select') tg.HapticFeedback.selectionChanged();
  else tg.HapticFeedback.impactOccurred('light');
} catch (e) {} };
const ask = (text) => new Promise(res => {
  try { if (inTg && tg.showConfirm) return tg.showConfirm(text, ok => res(!!ok)); } catch (e) {}
  res(window.confirm(text));
});

/* ---------- Storage: Telegram CloudStorage or localStorage ---------- */
const useCloud = inTg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9');
const LP = 'ms_';
const Store = {
  getAll() {
    return new Promise(resolve => {
      if (useCloud) {
        tg.CloudStorage.getKeys((err, keys) => {
          if (err || !keys || !keys.length) return resolve({});
          tg.CloudStorage.getItems(keys, (e2, vals) => resolve(e2 ? {} : (vals || {})));
        });
      } else {
        const out = {};
        try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith(LP)) out[k.slice(LP.length)] = localStorage.getItem(k); } } catch (e) {}
        resolve(out);
      }
    });
  },
  set(key, val) {
    if (val.length > 4096) console.warn('CloudStorage: запись слишком большая', key, val.length);
    if (useCloud) { try { tg.CloudStorage.setItem(key, val, (err) => { if (err) console.warn('CloudStorage error', key, err); }); } catch (e) {} }
    try { localStorage.setItem(LP + key, val); } catch (e) {}
  },
  remove(key) {
    if (useCloud) { try { tg.CloudStorage.removeItem(key, () => {}); } catch (e) {} }
    try { localStorage.removeItem(LP + key); } catch (e) {}
  }

/* persistence (v2, компактно, чтобы каждая запись помещалась в лимит Telegram 4096 символов):
   habits -> 'habits' (массив);
   daily  -> 'd_YYYY_MM' {v:2, m:{habitId:'0101…' по дням месяца}};
   weekly -> 'w_YYYY'    {v:2, m:{habitId:'0101…' по неделям года}};
   ui     -> 'ui' {accent, intro} */
const MAX_HABITS = 25;
const yearWeek0 = y => monday(new Date(y, 0, 1, 12));
const weekIdx = k => Math.round((pd(k) - yearWeek0(+k.slice(0, 4))) / (7 * 86400000));
const dirty = new Set(); let saveT = null;
const markDirty = key => { dirty.add(key); clearTimeout(saveT); saveT = setTimeout(flush, 350); };
function packBits(map) { // {id: Set(idx)} -> {id: '0101'}
  const m = {};
  for (const id in map) { const arr = [...map[id]]; if (!arr.length) continue; const max = Math.max(...arr); let s = ''; for (let i = 0; i <= max; i++) s += map[id].has(i) ? '1' : '0'; m[id] = s; }
  return m;
}
function flush() {
  for (const key of dirty) {
    if (key === 'habits') { Store.set('habits', JSON.stringify(S.habits)); continue; }
    if (key === 'ui') { Store.set('ui', JSON.stringify({ accent: UI.accent, intro: UI.intro, cur: UI.cur })); continue; }
    if (key === 'pls') { Store.set('pls', JSON.stringify(P.series)); continue; }
    if (key.startsWith('pl_')) { // план месяца, по частям до ~3800 символов
      const ym = key.slice(3).replace('_', '-'), list = P.items[ym] || [], chunks = []; let cur = [];
      for (const it of list) { cur.push(it); if (JSON.stringify(cur).length > 3800) { cur.pop(); chunks.push(cur); cur = [it]; } }
      if (cur.length) chunks.push(cur);
      for (let i = 0; i < 6; i++) { if (chunks[i]) Store.set(key + '_' + i, JSON.stringify(chunks[i])); else Store.remove(key + '_' + i); }
      continue;
    }
    const map = {};
    const add = (id, i) => (map[id] || (map[id] = new Set())).add(i);
    if (key[0] === 'd') {
      const [, y, m] = key.split('_');
      for (const k in S.d) if (k.startsWith(y + '-' + m + '-')) for (const id of S.d[k]) add(id, +k.slice(8) - 1);
    } else {
      const [, y] = key.split('_');
      for (const k in S.w) if (k.startsWith(y + '-')) for (const id of S.w[k]) add(id, weekIdx(k));
    }
    const m = packBits(map);
    if (Object.keys(m).length) Store.set(key, JSON.stringify({ v: 2, m })); else Store.remove(key);
  }
  dirty.clear();
}
window.addEventListener('pagehide', flush);
document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });

async function load() {
  const all = await Store.getAll();
  for (const key in all) {
    let v; try { v = JSON.parse(all[key]); } catch (e) { continue; }
    if (key === 'habits' && Array.isArray(v)) S.habits = v;
    else if (key === 'rem' && v && typeof v === 'object') UI.rem = v;
    else if (key === 'pro' && v && typeof v === 'object') UI.pro = v;
    else if (key === 'lt' && typeof v === 'number') UI.lt = v;
    else if (key === 'ui' && v && typeof v === 'object') { if (ACCENTS.includes(v.accent)) UI.accent = v.accent; UI.intro = !!v.intro; if (CURS.includes(v.cur)) UI.cur = v.cur; }
    else if (key === 'pls' && Array.isArray(v)) P.series = v;
    else if (/^pl_\d{4}_\d{2}_\d$/.test(key) && Array.isArray(v)) { const ym = key.slice(3, 10).replace('_', '-'); (P.parts ||= {})[ym] = P.parts[ym] || []; P.parts[ym][+key.slice(11)] = v; }
    else if (/^d_\d{4}_\d{2}$/.test(key)) {
      const [, y, m] = key.split('_');
      if (v && v.v === 2) { for (const id in v.m) [...v.m[id]].forEach((c, i) => { if (c === '1') (S.d[y + '-' + m + '-' + pad(i + 1)] ||= []).push(id); }); }
      else for (const day in v) S.d[y + '-' + m + '-' + pad(day)] = String(v[day]).split(',').filter(Boolean); // старый формат
    }
    else if (/^w_\d{4}$/.test(key)) {
      const [, y] = key.split('_');
      if (v && v.v === 2) { for (const id in v.m) [...v.m[id]].forEach((c, i) => { if (c === '1') (S.w[dk(addD(yearWeek0(+y), 7 * i))] ||= []).push(id); }); }
      else for (const md in v) S.w[y + '-' + md] = String(v[md]).split(',').filter(Boolean);
    }
  }
  for (const ym in (P.parts || {})) P.items[ym] = P.parts[ym].filter(Boolean).flat();
  delete P.parts;
  for (const key in all) if (/^[dw]_/.test(key) && !all[key].includes('"v":2')) markDirty(key);
  if (!all.lt) { UI.lt = Date.now(); Store.set('lt', String(UI.lt)); }
  if (!all.habits) {
    const start = TK();
    S.habits = DEFAULTS.map(([name, icon, type]) => ({ id: uid(), name, icon, type, goal: type === 'd' ? 31 : 4, created: start }));
    markDirty('habits');
  } else {
    // старые привычки с эмодзи получают линейную иконку
    let changed = false;
    for (const h of S.habits) if (!h.icon) { h.icon = guessIcon(h); changed = true; }
    if (changed) markDirty('habits');
  }
  // у тех, кто уже пользовался приложением, стартовый экран не показываем
  if (all.habits && !all.ui) { UI.intro = true; markDirty('ui'); }
}

/* ---------- Chart (smooth area, monotone cubic) ---------- */
function smoothPath(pts) {
  if (pts.length < 2) return pts.length ? `M${pts[0][0]},${pts[0][1]}` : '';
  const n = pts.length, dx = [], dy = [], m = [], t = [];
  for (let i = 0; i < n - 1; i++) { dx[i] = pts[i + 1][0] - pts[i][0]; dy[i] = pts[i + 1][1] - pts[i][1]; m[i] = dy[i] / dx[i]; }
  t[0] = m[0]; t[n - 1] = m[n - 2];
  for (let i = 1; i < n - 1; i++) t[i] = (m[i - 1] * m[i] <= 0) ? 0 : (m[i - 1] + m[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (m[i] === 0) { t[i] = 0; t[i + 1] = 0; continue; }
    const a = t[i] / m[i], b = t[i + 1] / m[i], s = a * a + b * b;
    if (s > 9) { const k = 3 / Math.sqrt(s); t[i] = k * a * m[i]; t[i + 1] = k * b * m[i]; }
  }
  let p = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < n - 1; i++) {
    const h = dx[i] / 3;
    p += ` C${(pts[i][0] + h).toFixed(1)},${(pts[i][1] + t[i] * h).toFixed(1)} ${(pts[i + 1][0] - h).toFixed(1)},${(pts[i + 1][1] - t[i + 1] * h).toFixed(1)} ${pts[i + 1][0].toFixed(1)},${pts[i + 1][1].toFixed(1)}`;
  }
  return p;
}
function areaChart(values, labels, W, H, mark) {
  const pl = 14, pr = 10, pt = 14, pb = 22, iw = W - pl - pr, ih = H - pt - pb, n = values.length;
  const X = i => pl + (n === 1 ? iw / 2 : i * iw / (n - 1)), Y = v => pt + ih - v * ih;
  let g = `<line x1="${pl}" x2="${W - pr}" y1="${Y(1)}" y2="${Y(1)}" style="stroke:rgba(255,255,255,.08);stroke-dasharray:3 5"/>
    <line x1="${pl}" x2="${W - pr}" y1="${Y(.5)}" y2="${Y(.5)}" style="stroke:rgba(255,255,255,.08);stroke-dasharray:3 5"/>
    <line x1="${pl}" x2="${W - pr}" y1="${Y(0)}" y2="${Y(0)}" style="stroke:rgba(255,255,255,.14)"/>
    <text x="${W - pr}" y="${Y(1) - 4}" text-anchor="end">100%</text><text x="${W - pr}" y="${Y(.5) - 4}" text-anchor="end">50%</text>`;
  labels.forEach((l, i) => { if (l !== '') g += `<text x="${X(i)}" y="${H - 4}" text-anchor="middle">${l}</text>`; });
  const segs = []; let cur = [];
  values.forEach((v, i) => { if (v == null) { if (cur.length) segs.push(cur); cur = []; } else cur.push([X(i), Y(v)]); });
  if (cur.length) segs.push(cur);
  let body = '';
  for (const s of segs) {
    const line = smoothPath(s);
    body += `<path d="${line} L${s[s.length - 1][0].toFixed(1)},${Y(0)} L${s[0][0].toFixed(1)},${Y(0)} Z" fill="url(#ga)"/>`;
    body += `<path d="${line}" style="fill:none;stroke:var(--a);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"/>`;
  }
  if (mark != null && values[mark] != null) body += `<circle cx="${X(mark)}" cy="${Y(values[mark])}" r="5" style="fill:#0A0B08;stroke:var(--a);stroke-width:2.5"/>`;
  if (!segs.length) body += `<text x="${pl + iw / 2}" y="${pt + ih / 2}" text-anchor="middle" style="fill:#A3A797;font-size:13px">Данных пока нет</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="График выполнения по дням"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--a);stop-opacity:.45"/><stop offset="1" style="stop-color:var(--a);stop-opacity:0"/></linearGradient></defs>${g}${body}</svg>`;
}

document.addEventListener('pointerdown', e => {
  const hd = e.target.closest('[data-drag]'); if (!hd) return;
  e.preventDefault();
  const el = hd.closest('.ritem'), list = el.parentElement, items = [...list.children];
  const rects = items.map(i => i.getBoundingClientRect()), from = items.indexOf(el), gap = 10, y0 = e.clientY;
  let to = from;

  const move = ev => {
    const dy = ev.clientY - y0; el.style.transform = `translateY(${dy}px)`;
    const cy = rects[from].top + rects[from].height / 2 + dy;
    to = rects.filter((r, i) => i !== from && r.top + r.height / 2 < cy).length;
    const sh = rects[from].height + gap;
    items.forEach((it, i) => {
      if (i === from) return;
      const s = from < to && i > from && i <= to ? -sh : from > to && i < from && i >= to ? sh : 0;
      it.style.transform = s ? `translateY(${s}px)` : '';

  };
  const up = () => {

    items.forEach(it => { it.style.transform = ''; }); el.classList.remove('drag');
    if (to !== from) {
      const type = list.dataset.group, group = S.habits.filter(h => h.type === type);
      const [moved] = group.splice(from, 1); group.splice(to, 0, moved);
      S.habits = type === 'd' ? [...group, ...weekly()] : [...daily(), ...group];
      markDirty('habits'); haptic('select'); render(); scheduleSync();
    }
  };
  hd.addEventListener('pointermove', move); hd.addEventListener('pointerup', up); hd.addEventListener('pointercancel', up);
});
